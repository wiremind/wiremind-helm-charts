  names:
    kind: IOChaos
    listKind: IOChaosList
    plural: iochaos
    singular: iochaos
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.action
          name: action
          type: string
        - jsonPath: .spec.duration
          name: duration
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              properties:
                action:
                  enum:
                    - latency
                    - fault
                    - attrOverride
