                        type: string
                      type: array
                    nodeSelectors:
                      additionalProperties:
                        type: string
                      type: object
                    nodes:
                      items:
                        type: string
                      type: array
                    podPhaseSelectors:
                      items:
                        type: string
                      type: array
                    pods:
                      additionalProperties:
                        items:
                          type: string
                        type: array
                      type: object
                  type: object
                stressngStressors:
                  type: string
                stressors:
                  properties:
                    cpu:
