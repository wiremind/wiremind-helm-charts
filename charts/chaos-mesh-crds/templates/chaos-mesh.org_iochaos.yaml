                          type: integer
                        sec:
                          format: int64
                          type: integer
                      required:
                        - nsec
                        - sec
                      type: object
                    blocks:
                      format: int64
                      type: integer
                    ctime:
                      properties:
                        nsec:
                          format: int64
                          type: integer
                        sec:
                          format: int64
                          type: integer
                      required:
                        - nsec
                        - sec
                      type: object
                    gid:
                      format: int32
                      type: integer
                    ino:
                      format: int64
                      type: integer
                    kind:
                      type: string
                    mtime:
                      properties:
                        nsec:
                          format: int64
                          type: integer
                        sec:
                          format: int64
                          type: integer
                      required:
                        - nsec
                        - sec
                      type: object
                    nlink:
                      format: int32
                      type: integer
                    perm:
                      type: integer
                    rdev:
                      format: int32
                      type: integer
                    size:
                      format: int64
                      type: integer
                    uid:
                      format: int32
                      type: integer
                  type: object
                containerNames:
                  items:
                    type: string
                  type: array
                delay:
                  type: string
                duration:
                  type: string
                errno:
                  format: int32
                  type: integer
                methods:
                  items:
                    type: string
                  type: array
                mistake:
                  properties:
                    filling:
                      enum:
                        - zero
                        - random
                      type: string
                    maxLength:
                      format: int64
                      minimum: 1
                      type: integer
                    maxOccurrences:
                      format: int64
                      minimum: 1
                      type: integer
                  type: object
                mode:
                  enum:
                    - one
                    - all
                    - fixed
                    - fixed-percent
                    - random-max-percent
                  type: string
                path:
                  type: string
                percent:
                  default: 100
                  type: integer
                remoteCluster:
                  type: string
                selector:
                  properties:
                    annotationSelectors:
                      additionalProperties:
                        type: string
                      type: object
                    expressionSelectors:
                      items:
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                          values:
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                          - key
                          - operator
                        type: object
                      type: array
                    fieldSelectors:
                      additionalProperties:
                        type: string
                      type: object
                    labelSelectors:
                      additionalProperties:
                        type: string
                      type: object
                    namespaces:
                      items:
                        type: string
                      type: array
                    nodeSelectors:
                      additionalProperties:
                        type: string
                      type: object
                    nodes:
                      items:
                        type: string
                      type: array
                    podPhaseSelectors:
                      items:
                        type: string
                      type: array
                    pods:
                      additionalProperties:
                        items:
                          type: string
                        type: array
                      type: object
                  type: object
                value:
