---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: podchaos.chaos-mesh.org
spec:
  group: chaos-mesh.org
  names:
    kind: PodChaos
    listKind: PodChaosList
    plural: podchaos
    singular: podchaos
  scope: Namespaced
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              properties:
                action:
                  enum:
                    - pod-kill
                    - pod-failure
                    - container-kill
                  type: string
                containerNames:
                  items:
                    type: string
                  type: array
                duration:
                  type: string
                gracePeriod:
                  format: int64
                  minimum: 0
                  type: integer
                mode:
                  enum:
                    - one
                    - all
                    - fixed
                    - fixed-percent
                    - random-max-percent
                  type: string
                remoteCluster:
                  type: string
                selector:
                  properties:
                    annotationSelectors:
                      additionalProperties:
                        type: string
                      type: object
                    expressionSelectors:
                      items:
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                          values:
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                          - key
                          - operator
                        type: object
                      type: array
                    fieldSelectors:
                      additionalProperties:
                        type: string
                      type: object
                    labelSelectors:
                      additionalProperties:
                        type: string
                      type: object
                    namespaces:
                      items:
                        type: string
                      type: array
                    nodeSelectors:
                      additionalProperties:
                        type: string
                      type: object
                    nodes:
                      items:
                        type: string
                      type: array
                    podPhaseSelectors:
                      items:
                        type: string
                      type: array
                    pods:
                      additionalProperties:
                        items:
                          type: string
                        type: array
                      type: object
                  type: object
                value:
                  type: string
              required:
                - action
                - mode
                - selector
              type: object
            status:
              properties:
                conditions:
                  items:
                    properties:
                      reason:
                        type: string
                      status:
                        type: string
                      type:
                        type: string
                    required:
                      - status
                      - type
                    type: object
                  type: array
                experiment:
                  properties:
                    containerRecords:
                      items:
                        properties:
                          events:
                            items:
                              properties:
                                message:
                                  type: string
                                operation:
                                  type: string
                                timestamp:
                                  format: date-time
                                  type: string
                                type:
                                  type: string
                              required:
                                - operation
                                - timestamp
                                - type
                              type: object
                            type: array
                          id:
                            type: string
                          injectedCount:
                            type: integer
                          phase:
                            type: string
                          recoveredCount:
                            type: integer
                          selectorKey:
                            type: string
                        required:
                          - id
                          - injectedCount
                          - phase
                          - recoveredCount
                          - selectorKey
                        type: object
                      type: array
                    desiredPhase:
                      enum:
                        - Run
                        - Stop
                      type: string
                  type: object
              required:
                - experiment
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
