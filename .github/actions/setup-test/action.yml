name: Setup tools

description: 'Sets up required tools for charts'

runs:
  using: composite
  steps:
    - name: Set up chart-testing
      uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

    - name: Install kubeconform
      shell: bash
      run: |
        helm plugin install https://github.com/jtyr/kubeconform-helm --version v0.1.17
